        .exhibition-hero img {
            width: 100%;
            height: auto;
            border: 1px solid #eeeeee;
            display: block;
            animation: fluttua 3s ease-in-out infinite alternate;
        }

        @keyframes fluttua {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-25px); }
        }
