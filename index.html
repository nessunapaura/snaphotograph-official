<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAPHOTOGRAPH</title>
    <style>
        /* RESET STRUTTURALE ASETTICO */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            background-color: #ffffff; 
            color: #111111; 
            font-family: sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* MENU A SINISTRA BIANCO */
        nav { 
            width: 260px; 
            height: 100%; 
            border-right: 1px solid #39ff14; 
            padding: 60px 35px; 
            background-color: #ffffff; 
            flex-shrink: 0;
        }
        
        nav .brand { 
            font-size: 0.75rem; 
            color: #39ff14; 
            letter-spacing: 2px; 
            margin-bottom: 60px; 
            font-weight: bold; 
        }
        
        nav ul { 
            list-style: none; 
        }
        
        nav ul li { 
            margin-bottom: 30px; 
        }
        
        nav ul li a { 
            color: #888888; 
            text-decoration: none; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        nav ul li a.active { 
            color: #39ff14; 
        }

        /* AREA CONTENUTO A DESTRA */
        main { 
            flex: 1; 
            padding: 60px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #ffffff; 
        }
        
        .header { 
            text-align: center; 
            width: 100%; 
            max-width: 1000px; 
        }
        
        h1 { 
            color: #39ff14; 
            font-size: 3rem; 
            font-weight: 300; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
        }
        
        .sub { 
            color: #888888; 
            font-size: 1.05rem; 
            letter-spacing: 2px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
        }
        
        hr { 
            border: none; 
            height: 1px; 
            background-color: #39ff14; 
            width: 100%; 
            margin-bottom: 50px; 
        }

        /* STRUTTURA CON ANIMAZIONE FLUTTUANTE CONTINUA */
        .exhibition-hero { 
            width: 100%; 
            max-width: 900px; 
            margin-bottom: 45px; 
            display: flex; 
            justify-content: center; 
        }
        
        .exhibition-hero img { 
            width: 100%; 
            height: auto; 
            display: block; 
            animation: muoviContinuo 3s ease-in-out infinite alternate; 
        }
        
        /* MOTORE DEL MOVIMENTO CONTINUO */
        @keyframes muoviContinuo {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-30px); }
        }

        /* DATI CATALOGO */
        .meta { 
            width: 100%; 
            max-width: 900px; 
            text-align: left; 
            margin-bottom: 40px; 
        }
        
        .row { 
            margin-bottom: 16px; 
            font-size: 0.95rem; 
            border-bottom: 1px dashed #f0f0f0; 
            padding-bottom: 8px; 
        }
        
        .label { 
            color: #39ff14; 
            font-weight: bold; 
            display: inline-block; 
            width: 150px; 
        }
        
        .value { 
            color: #222222; 
            font-weight: 300; 
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">MENU // INDEX</div>
        <ul>
            <li><a class="active">Banality (2027)</a></li>
            <li><a>Manifesto</a></li>
            <li><a>Nessuna Paura</a></li>
        </ul>
    </nav>

    <main>
        <div class="header">
            <h1>SNAPHOTOGRAPH</h1>
            <div class="sub">Art & Communication</div>
            <hr>
        </div>

        <!-- L'OPERA CON IL TUO FILE TESTATA.SVG AGGANCIATO -->
        <div class="exhibition-hero">
            <img src="testata.svg" alt="SNAPHOTOGRAPH Art">
        </div>

        <div class="meta">
            <div class="row"><span class="label">MOSTRA:</span><span class="value">BANALITY, art is a banana bla...bla..blaaaa</span></div>
            <div class="row"><span class="label">ARTISTA:</span><span class="value">Luca Simonetti</span></div>
            <div class="row"><span class="label">ATTO I:</span><span class="value">DUCHAMP'S URINAL (Non-Fungible Reality)</span></div>
            <div class="row"><span class="label">SPAZIO:</span><span class="value">Galleria SNAPHOTOGRAPH c/o Club Tamerò, Firenze</span></div>
        </div>
    </main>

</body>
</html>
